<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WTS Conciergerie · Espace concierge</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{height:auto;min-height:100%}
.c-wrap{max-width:1040px;margin:0 auto;padding:0 20px 40px}
.c-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.c-bar .who{border:0;padding:0}
.c-grid{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.c-grid{grid-template-columns:1fr}.c-grid.open .c-list{display:none}.c-grid:not(.open) .c-detail{display:none}}
.c-tabs{display:flex;gap:8px;margin-bottom:12px}
.c-item{display:block;width:100%;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid transparent}
.c-item:hover,.c-item[aria-current="true"]{border-color:var(--fg)}
.c-item .t{font:500 19px var(--display)}
.c-item .s{font-size:12px;color:var(--muted);margin-top:2px}
.c-item .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-box{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.c-box h2{margin:0 0 10px;font:400 11px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kv a{color:inherit}
.c-times{font-size:12px;color:var(--muted)}
.c-login{max-width:380px;margin:12vh auto 0}
.c-dirty{font-size:12px;color:var(--err);margin:8px 0 0;display:none}
.c-att a{display:inline-block;margin:0 8px 8px 0}
.fld textarea{min-height:52px}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="c-wrap" id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" style="position:fixed;bottom:24px"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="concierge.js"></script>
</body>
</html>
